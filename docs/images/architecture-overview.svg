<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="System architecture overview">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1100" height="720" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Platform Architecture</text>

  <!-- Clients -->
  <rect x="40" y="60" width="1020" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="82" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">CLIENTS</text>
  <rect x="80" y="95" width="180" height="40" rx="6" fill="#0f172a" stroke="#22d3ee" filter="url(#shadow)"/>
  <text x="170" y="121" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Segoe UI, sans-serif">Tx Generator</text>
  <rect x="300" y="95" width="180" height="40" rx="6" fill="#0f172a" stroke="#22d3ee" filter="url(#shadow)"/>
  <text x="390" y="121" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Segoe UI, sans-serif">Dashboard (Next.js)</text>
  <rect x="520" y="95" width="180" height="40" rx="6" fill="#0f172a" stroke="#64748b" filter="url(#shadow)"/>
  <text x="610" y="121" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">External API Clients</text>

  <!-- Edge -->
  <rect x="380" y="175" width="340" height="50" rx="8" fill="#312e81" stroke="#6366f1" filter="url(#shadow)"/>
  <text x="550" y="207" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="600" font-family="Segoe UI, sans-serif">API Gateway :8080</text>

  <!-- Ingestion -->
  <rect x="40" y="250" width="500" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="272" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">INGESTION</text>
  <rect x="80" y="285" width="200" height="48" rx="6" fill="#0f172a" stroke="#34d399"/>
  <text x="180" y="315" text-anchor="middle" fill="#d1fae5" font-size="12" font-family="Segoe UI, sans-serif">Tx Ingestion</text>
  <rect x="300" y="285" width="200" height="48" rx="6" fill="#0f172a" stroke="#34d399"/>
  <text x="400" y="315" text-anchor="middle" fill="#d1fae5" font-size="12" font-family="Segoe UI, sans-serif">Idempotency · Redis/PG</text>

  <!-- Kafka -->
  <ellipse cx="550" cy="400" rx="120" ry="45" fill="#422006" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="398" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif">Apache Kafka</text>
  <text x="550" y="418" text-anchor="middle" fill="#fcd34d" font-size="10" font-family="monospace">10 topics · partitioned</text>

  <!-- Processing -->
  <rect x="40" y="470" width="1020" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="492" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">EVENT PROCESSING (Go microservices)</text>
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="60" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="125" y="530" text-anchor="middle">Bank Simulator</text>
    <rect x="205" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="270" y="530" text-anchor="middle">Failure Detector</text>
    <rect x="350" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="415" y="530" text-anchor="middle">Retry Orchestrator</text>
    <rect x="495" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="560" y="530" text-anchor="middle">Intelligent Routing</text>
    <rect x="640" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="705" y="530" text-anchor="middle">Fraud Detector</text>
    <rect x="785" y="505" width="130" height="40" rx="5" fill="#0f172a" stroke="#64748b"/><text x="850" y="530" text-anchor="middle">Notification</text>
    <rect x="930" y="505" width="110" height="40" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="985" y="530" text-anchor="middle">AI Prediction</text>
  </g>

  <!-- Insight -->
  <rect x="600" y="250" width="460" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="620" y="272" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">INSIGHT &amp; OPS</text>
  <rect x="640" y="285" width="180" height="48" rx="6" fill="#0f172a" stroke="#22d3ee"/>
  <text x="730" y="315" text-anchor="middle" fill="#cffafe" font-size="12" font-family="Segoe UI, sans-serif">Analytics + WebSocket</text>
  <rect x="840" y="285" width="180" height="48" rx="6" fill="#0f172a" stroke="#64748b"/>
  <text x="930" y="315" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Prometheus · Grafana · Jaeger</text>

  <!-- Data plane -->
  <rect x="40" y="610" width="1020" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="632" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">DATA PLANE</text>
  <rect x="200" y="645" width="160" height="40" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <text x="280" y="671" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="Segoe UI, sans-serif">PostgreSQL</text>
  <rect x="470" y="645" width="160" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="550" y="671" text-anchor="middle" fill="#fecaca" font-size="12" font-family="Segoe UI, sans-serif">Redis</text>
  <rect x="740" y="645" width="160" height="40" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="820" y="671" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Segoe UI, sans-serif">Kafka (KRaft)</text>

  <!-- Arrows -->
  <line x1="390" y1="135" x2="480" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="135" x2="550" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="225" x2="280" y2="285" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="333" x2="480" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="445" x2="550" y2="505" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="333" x2="650" y2="365" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="135" x2="730" y2="285" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Operations dashboard preview">
  <rect width="960" height="540" fill="#09090b"/>
  <rect x="0" y="0" width="960" height="52" fill="#18181b" stroke="#27272a"/>
  <circle cx="28" cy="26" r="8" fill="#22c55e"/>
  <text x="48" y="32" fill="#fafafa" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">UPI Operations Center</text>
  <text x="800" y="32" fill="#22c55e" font-family="monospace" font-size="11">Ï LIVE</text>
  <text x="880" y="32" fill="#71717a" font-family="monospace" font-size="10">WS connected</text>

  <!-- Metric cards -->
  <g transform="translate(24, 68)">
    <rect width="210" height="88" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="28" fill="#71717a" font-size="11" font-family="Segoe UI, sans-serif">TPS</text>
    <text x="16" y="58" fill="#22d3ee" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">4,821</text>
    <text x="16" y="76" fill="#22c55e" font-size="10" font-family="Segoe UI, sans-serif">‘ 12.4%</text>
  </g>
  <g transform="translate(252, 68)">
    <rect width="210" height="88" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="28" fill="#71717a" font-size="11" font-family="Segoe UI, sans-serif">Success Rate</text>
    <text x="16" y="58" fill="#22c55e" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">97.2%</text>
  </g>
  <g transform="translate(480, 68)">
    <rect width="210" height="88" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="28" fill="#71717a" font-size="11" font-family="Segoe UI, sans-serif">P95 Latency</text>
    <text x="16" y="58" fill="#fbbf24" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">142ms</text>
  </g>
  <g transform="translate(708, 68)">
    <rect width="228" height="88" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="16" y="28" fill="#71717a" font-size="11" font-family="Segoe UI, sans-serif">Retries / DLQ</text>
    <text x="16" y="58" fill="#f97316" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">38 / 2</text>
  </g>

  <!-- Throughput chart -->
  <rect x="24" y="176" width="580" height="200" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="40" y="200" fill="#a1a1aa" font-size="12" font-family="Segoe UI, sans-serif">Throughput (60s)</text>
  <polyline points="40,340 80,310 120,300 160,280 200,290 240,260 280,250 320,240 360,230 400,220 440,235 480,210 520,200 560,195 600,185" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <polyline points="40,350 120,330 200,320 280,300 360,290 440,285 520,270 600,265" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>

  <!-- Retry panel -->
  <rect x="620" y="176" width="316" height="200" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="636" y="200" fill="#a1a1aa" font-size="12" font-family="Segoe UI, sans-serif">Retry Queue</text>
  <rect x="636" y="215" width="284" height="28" rx="4" fill="#27272a"/><text x="648" y="234" fill="#e4e4e7" font-size="10" font-family="monospace">TXN-a1f2 · HDFC · attempt 2</text>
  <rect x="636" y="250" width="284" height="28" rx="4" fill="#27272a"/><text x="648" y="269" fill="#e4e4e7" font-size="10" font-family="monospace">TXN-b8c3 · ICICI · attempt 1</text>
  <rect x="636" y="285" width="284" height="28" rx="4" fill="#450a0a" stroke="#ef4444"/><text x="648" y="304" fill="#fecaca" font-size="10" font-family="monospace">TXN-dl01 · DLQ · max retries</text>

  <!-- Bank health -->
  <rect x="24" y="392" width="450" height="128" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="40" y="416" fill="#a1a1aa" font-size="12" font-family="Segoe UI, sans-serif">Bank Health</text>
  <g font-family="Segoe UI, sans-serif" font-size="10">
    <rect x="40" y="428" width="70" height="36" rx="4" fill="#052e16" stroke="#22c55e"/><text x="75" y="452" text-anchor="middle" fill="#86efac">HDFC</text>
    <rect x="120" y="428" width="70" height="36" rx="4" fill="#052e16" stroke="#22c55e"/><text x="155" y="452" text-anchor="middle" fill="#86efac">ICICI</text>
    <rect x="200" y="428" width="70" height="36" rx="4" fill="#422006" stroke="#f59e0b"/><text x="235" y="452" text-anchor="middle" fill="#fcd34d">SBI</text>
    <rect x="280" y="428" width="70" height="36" rx="4" fill="#052e16" stroke="#22c55e"/><text x="315" y="452" text-anchor="middle" fill="#86efac">AXIS</text>
    <rect x="360" y="428" width="70" height="36" rx="4" fill="#450a0a" stroke="#ef4444"/><text x="395" y="452" text-anchor="middle" fill="#fca5a5">PNB</text>
  </g>

  <!-- Live feed -->
  <rect x="490" y="392" width="446" height="128" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="506" y="416" fill="#a1a1aa" font-size="12" font-family="Segoe UI, sans-serif">Live Events</text>
  <text x="506" y="442" fill="#22c55e" font-size="10" font-family="monospace">SUCCESS TXN-9x2a ¹1,240 HDFC 18ms</text>
  <text x="506" y="462" fill="#f97316" font-size="10" font-family="monospace">RETRY   TXN-7b1c ICICI timeout</text>
  <text x="506" y="482" fill="#22d3ee" font-size="10" font-family="monospace">INGEST  TXN-3f9d ¹89,000 ’ validated</text>
  <text x="506" y="502" fill="#ef4444" font-size="10" font-family="monospace">FRAUD   TXN-2a8e HIGH severity alert</text>
</svg>

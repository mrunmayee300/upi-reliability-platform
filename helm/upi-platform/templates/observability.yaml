{{- if .Values.infra.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: upi-otel-collector
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
    - port: 4318
      name: otlp-http
    - port: 8889
      name: metrics
  selector:
    app: upi-otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upi-otel-collector
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upi-otel-collector
  template:
    metadata:
      labels:
        app: upi-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.102.1
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - containerPort: 4318
            - containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
      volumes:
        - name: config
          configMap:
            name: upi-otel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upi-otel-config
  namespace: {{ .Values.global.namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: upi-jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: v1
kind: Service
metadata:
  name: upi-jaeger
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
    - port: 16686
      name: ui
    - port: 4317
      name: otlp
  selector:
    app: upi-jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upi-jaeger
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upi-jaeger
  template:
    metadata:
      labels:
        app: upi-jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.58
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
{{- end }}

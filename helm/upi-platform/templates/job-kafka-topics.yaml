apiVersion: batch/v1
kind: Job
metadata:
  name: upi-kafka-topics
  namespace: {{ .Values.global.namespace }}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z upi-kafka 9092; do sleep 2; done']
      containers:
        - name: create-topics
          image: {{ .Values.infra.kafka.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              BS=upi-kafka:9092
              create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BS --create --if-not-exists --topic "$1" --partitions "$2" --replication-factor 1; }
              create upi-transactions 24
              create validated-transactions 24
              create failed-transactions 12
              create retry-transactions 12
              create fraud-alerts 6
              create latency-events 12
              create bank-health 6
              create congestion-events 6
              create analytics-events 12
              create dead-letter-events 6
              echo "Topics ready"

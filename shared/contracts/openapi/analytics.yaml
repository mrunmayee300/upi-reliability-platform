openapi: 3.1.0
info:
  title: Analytics Service
  version: 1.0.0
  description: Real-time aggregates, dashboard API, WebSocket fan-out

servers:
  - url: http://localhost:8089

paths:
  /health/ready:
    get:
      responses:
        '200':
          description: OK

  /v1/metrics/summary:
    get:
      operationId: getSummary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSummary'

  /v1/metrics/banks:
    get:
      operationId: getBankMetrics
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/bank-health.json'

  /v1/metrics/retries:
    get:
      operationId: getRetryMetrics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryMetrics'

  /v1/ws/live:
    get:
      operationId: websocketLive
      summary: WebSocket upgrade for live dashboard stream
      responses:
        '101':
          description: Switching Protocols

components:
  schemas:
    PlatformSummary:
      type: object
      properties:
        tps:
          type: number
        success_rate:
          type: number
        failure_rate:
          type: number
        retry_rate:
          type: number
        p50_latency_ms:
          type: integer
        p95_latency_ms:
          type: integer
        p99_latency_ms:
          type: integer
        kafka_lag_total:
          type: integer

    RetryMetrics:
      type: object
      properties:
        pending_retries:
          type: integer
        dlq_count_24h:
          type: integer
        avg_retry_attempts:
          type: number
